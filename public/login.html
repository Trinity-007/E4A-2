<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | E4A</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-bar">
      <div class="brand">E4A</div>
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="contact.html">Contact</a>
        <a href="messages.html" style="display:none;">Messages</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </div>
  </header>

  <main class="container auth-page">
    <div class="card form-card">
      <h1>Welcome back</h1>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required />
        <button type="submit" class="button">Login</button>
      </form>
      <p class="small-text">New here? <a href="register.html">Create an account</a>.</p>
      <p id="login-message" class="message"></p>
      <p class="small-text">Admin account: <strong>admin@e4a.com</strong> / <strong>Admin123!</strong></p>
    </div>
  </main>

  <footer class="container footer">
    <p>© 2026 E4A - Ebay for Africa.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
